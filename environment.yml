name: realsim
channels:
  - conda-forge
  - defaults
channel_priority: strict

dependencies:
  - python=3.10
  # Carla/carla_agents' route planner; without it a CARLA-agent controller cannot import.
  - networkx
  - numpy
  - pandas
  - plotly
  - pygame
  - protobuf
  - pytest
  - pyyaml
  - shapely
  # standalone/run_synchronization/sumo_integration/sumo_simulation.py imports lxml.etree.
  - lxml
  # No vs2015_runtime / vc14_runtime: win-64 only, and python pulls them in on Windows.
  - pip
  - pip:
    # Carla/VirEnv/CarlaViews.py camera windows and recordings, CarlaHud.py.
    - opencv-python
    - pillow
    # Pinned to the SUMO version in dependencies.yaml, as pyproject.toml is.
    - traci==1.22.0
    - sumolib==1.22.0
  # No carla: carla_env_setup.ensure_carla() installs the client matching the CARLA in use.
