name: realsim
channels:
  - conda-forge
  - defaults
channel_priority: strict

dependencies:
  - python=3.10
  - numpy
  - pandas
  - plotly
  - pygame
  - protobuf
  - pytest
  - pyyaml
  - shapely
  # Carla/sumo/run_synchronization/sumo_integration/sumo_simulation.py imports
  # lxml.etree, and nothing else installs it, so it has to be declared here.
  - lxml
  - vs2015_runtime
  - vc14_runtime
  - pip
  # No carla, traci or sumolib here on purpose. The release zip strips *.whl from
  # Carla/ (scripts/dispatch/8_create_zip.ps1), so a wheel path in this spec makes
  # `conda env create -f environment.yml` fail on every machine that consumes a
  # release - including carla_env_setup's own offer to create the env.
  # carla_env_setup.ensure_carla() installs the client after the env exists, and
  # picks the right one for the mode: the PyPI wheel (carla==0.9.15) for packaged
  # and client, the source build's own wheel for a source build; the same module
  # installs eclipse-sumo/traci/sumolib alongside it.
