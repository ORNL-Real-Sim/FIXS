name: realsim
channels:
  - conda-forge
  - defaults
channel_priority: strict

dependencies:
  - python=3.10
  - numpy
  - pandas
  - plotly
  - pygame
  - protobuf
  - pyyaml
  - vs2015_runtime
  - vc14_runtime
  - pip
  - pip:
      # Official CARLA 0.9.15 client from PyPI. pip auto-selects the correct
      # wheel for the platform + python (cp310 exists for both win_amd64 and
      # manylinux_2_27_x86_64), so this works on Windows now and Linux later
      # with no per-OS changes and no bundled wheel.
      - carla==0.9.15
      # SUMO Python bindings (also shipped with a SUMO system install, but
      # pinned here so the `realsim` env can run SUMO<->CARLA co-sim standalone)
      - traci
      - sumolib
