name: CI Smoke (public core PoC)

# Cheapest proof-of-concept for #191: prove that a hosted GitHub-hosted
# Windows runner can compile the PUBLIC core of FIXS with no proprietary
# toolchains and no private submodule.
#
# Scope on purpose kept minimal:
#   - dispatch step 1: build yaml-cpp from tracked source (CMake)
#   - dispatch step 2: build TrafficLayer.exe / CoordMerge (MSBuild)
# Deliberately NOT built here (need external/licensed deps):
#   - VirCarlaEnv      -> needs libcarla (gitignored, provisioned separately)
#   - VirtualEnvironment -> needs CarMaker SDK headers (licensed)
#   - VISSIM / CarMaker / dSPACE / MEX (dispatch steps 3, 5a, 5b, 6)
#
# Trigger is manual (workflow_dispatch) plus a push that touches this file,
# so it never runs on ordinary commits and never publishes a release.

on:
  workflow_dispatch:
  push:
    branches: [maintenance/191_release_ci]
    paths: ['.github/workflows/ci-smoke.yml']

jobs:
  build-core:
    # Pin to windows-2022 on purpose: it ships Visual Studio 2022 (v17), which
    # matches the generator dispatch derives from dependencies.yaml
    # ("Visual Studio 17 2022"). As of 2026 `windows-latest` ships VS 2026 (v18),
    # so CMake's v17 generator finds no VS instance and the build fails - and even
    # if it were bumped, CI would silently build with an unsupported compiler.
    # Keep CI on the same VS the release is validated against.
    runs-on: windows-2022
    steps:
      - name: Checkout (full history for git describe, no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags + history so generate_version.ps1 works
          submodules: false     # public build never needs ProprietaryFiles

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain versions (VS/CMake are preinstalled on the image)
        shell: pwsh
        run: |
          cmake --version
          msbuild -version
          # Demonstrates the #191 version fix: semver-only match, full describe
          git describe --tags --match "v[0-9]*" --always

      - name: Build external libs (yaml-cpp) - dispatch step 1
        shell: cmd
        run: |
          set RS_BUILD_CONFIG=Release
          set RS_FIXS_AUTOMATION=1
          call scripts\dispatch\1_external_libraries.bat

      - name: Build core (TrafficLayer, CoordMerge) - dispatch step 2
        shell: cmd
        run: |
          set RS_BUILD_CONFIG=Release
          set RS_FIXS_AUTOMATION=1
          call scripts\dispatch\2_core_components.bat inline

      - name: Assert TrafficLayer.exe was freshly built
        shell: pwsh
        run: |
          # Check the EXACT msbuild output path (gitignored build dir), NOT a
          # recursive search - the repo ships a committed tests/SumoCarla/
          # TrafficLayer.exe that a recursive find would match, masking a
          # no-op build. This path can only exist if this run produced it.
          $expected = "TrafficLayer\x64\Release\TrafficLayer.exe"
          if (-not (Test-Path $expected)) {
            Write-Error "Fresh build output not found: $expected (see build-logs artifact)."
            exit 1
          }
          $exe = Get-Item $expected
          Write-Host "OK - fresh build produced $($exe.FullName) ($([math]::Round($exe.Length/1KB)) KB, $($exe.LastWriteTime))"

      - name: Upload build logs (always, for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            scripts/dispatch/build.log
            scripts/dispatch/build_summary.log
          if-no-files-found: ignore
