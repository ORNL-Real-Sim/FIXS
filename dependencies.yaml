# External simulator and library dependencies for RS_FIXS
# Update these versions when syncing with upstream releases

simulators:
  sumo:
    version: "1.22.0"
    source: "https://github.com/eclipse/sumo"
    location: "CommonLib/libsumo"
    notes: "libsumo/libtraci headers and DLLs. NOT committed to git (#238) - gitignored, and fetched as the checksum-verified libsumo-<version>.zip asset from the rolling 'fixs-native-deps' release by scripts/initialize_fixs.ps1. Bumping this version requires publishing a matching asset first: scripts/dispatch/pack_native_deps.ps1 -Component sumo -Publish"

  carla:
    version: "0.9.15"
    source: "https://github.com/carla-simulator/carla"
    location: "CommonLib/libcarla"
    boost: "1.81.0"
    notes: "CARLA C++ client SDK, needed only by VirCarlaEnv. NOT committed to git - gitignored, and acquired into 'location' (which is where fetch_native_deps.ps1 has always installed it; the old 'VirCarlaEnv' value here was documentation that never matched). CARLA publishes no release assets at all, so the SDK exists only inside a built CARLA source tree and both platforms take it from <carla_root>/PythonAPI/carla/dependencies: on Windows via fetch_native_deps.ps1 -Mode source, on Linux as the libcarla-<version>-linux-x86_64.zip asset published by scripts/pack_native_deps.sh --component carla. Bumping this version requires publishing a matching asset first, exactly as sumo does. 'boost' records which boost the Linux SDK was built with - CARLA 0.9.15 ships 1.80.0 but needs a one-line Setup.sh bump to 1.81.0 to build on a modern toolchain, and the asset carries its own boost headers, so it is self-consistent even though the Windows SDK is on 1.80."

  carmaker:
    version: "13.1.3"
    versions:
      - "13.1.3"
      - "11.1.2"
    vendor: "IPG Automotive"
    location: "ProprietaryFiles/CM*_proj"
    notes: "Proprietary - multiple versions in use (CM9, CM10, CM11, CM13)"

libraries:
  yaml-cpp:
    location: "CommonLib/yaml-cpp"
    notes: "YAML configuration parser"

  yaml_matlab:
    version: "0.4.3"
    location: "CommonLib/YAMLMatlab"
    notes: "YAML parser for MATLAB"

development_tools:
  visual_studio:
    version: "2022"
    product: "Visual Studio 2022"
    notes: "Required for building all C++ components (TrafficLayer, CommonLib, VISSIM DLLs)"

  dspace:
    version: "2024a"
    product: "ConfigurationDesk 2024-A"
    release: "24.1"
    notes: "Used for building RealSimDsLib for CarMaker integration"

  matlab:
    version: "2024a"
    notes: "Required for building RealSimSocket MEX file and Simulink models"
