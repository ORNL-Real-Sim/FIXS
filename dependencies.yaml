# External simulator and library dependencies for RS_FIXS
# Update these versions when syncing with upstream releases

simulators:
  sumo:
    version: "1.22.0"
    source: "https://github.com/eclipse/sumo"
    location: "CommonLib/libsumo"
    notes: "libsumo/libtraci headers and DLLs vendored from SUMO release"

  carla:
    version: "0.9.15"
    source: "https://github.com/carla-simulator/carla"
    location: "VirCarlaEnv"
    notes: "CARLA client library"

  carmaker:
    version: "13.1.3"
    versions:
      - "13.1.3"
      - "11.1.2"
    vendor: "IPG Automotive"
    location: "ProprietaryFiles/CM*_proj"
    notes: "Proprietary - multiple versions in use (CM9, CM10, CM11, CM13)"

libraries:
  yaml-cpp:
    location: "CommonLib/yaml-cpp"
    notes: "YAML configuration parser"

  yaml_matlab:
    version: "0.4.3"
    location: "CommonLib/YAMLMatlab"
    notes: "YAML parser for MATLAB"

development_tools:
  visual_studio:
    version: "2022"
    product: "Visual Studio 2022"
    notes: "Required for building all C++ components (TrafficLayer, CommonLib, VISSIM DLLs)"

  dspace:
    version: "2024a"
    product: "ConfigurationDesk 2024-A"
    release: "24.1"
    notes: "Used for building RealSimDsLib for CarMaker integration"

  matlab:
    version: "2024a"
    notes: "Required for building RealSimSocket MEX file and Simulink models"
