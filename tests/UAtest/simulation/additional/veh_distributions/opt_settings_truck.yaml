# SampledSimpleCFConfig:
vehicle_distribution_name: 'vehDist'
cf_params:
  length:
    distribution: "uniform"
    bounds: [19, 23]
    params: 
      a: ${..bounds[0]}
      b: ${..bounds[1]}
  actionStepLength:
    val: 0.2
    is_attr: true
  vClass:
    val: trailer
    is_attr: true
  emissionClass:
    val: PHEMlight/HDV_TT_D_EU6
    is_attr: true
  carFollowModel:
    val: IDM
    is_attr: true
  jmTimegapMinor:
    val: 6.5
    is_attr: true

  speedFactor: 
    distribution: "normal"
    bounds: [0.7, 1.1]  
    params: 
      mu: 1
      sd: 0.1
  