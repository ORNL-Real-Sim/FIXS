# WorldModels endless-loop co-sim (#189) -- WITH the AlpaSim / CATK world model.
#
# SUMO -> TrafficLayer -> WM (alpasim). Ego loops (SUMO route); the CATK/SMART
# tokenized reactive model drives the surrounding bubble vehicles via moveToXY.
# CATK needs a torch env -- launch via run_with_wm_alpasim.bat.

SimulationSetup:
    EnableRealSim: true
    EnableVerboseLog: false
    SelectedTrafficSimulator: 'SUMO'
    TrafficSimulatorIP: "127.0.0.1"
    TrafficSimulatorPort: 1337
    VehicleMessageField: [id, type, vehicleClass, speed, positionX, positionY, positionZ, heading, speedDesired, laneId, length, width, height, signalLightId, signalLightColor, signalLightDistance, speedAdvisory]
    EnableExternalDynamics: false

SumoSetup:
    EnableAutoLaunch: true
    SumoConfigFile: "./simple_traffic_light.sumocfg"
    SpeedMode: 32

ApplicationSetup:
    EnableApplicationLayer: true
    VehicleSubscription:
    -   type: ego
        attribute: {id: ['ego'], radius: [400]}
        ip: ['127.0.0.1']
        port: [2444]

XilSetup:
    EnableXil: false

WorldModelSetup:
    Enable: true
    Backend: alpasim
    EgoId: 'ego'
    BevHalfExtent: 200.0
    StepLength: 0.1
    HistoryFrames: 16              # CATK needs >= 16 frames of history
    EgoFutureHorizon: 5            # ego plan pinned as the CATK conditioning
    # CATK is signal-aware (light_type): let it do its own braking for reds, and
    # only hand back once STOPPED so SUMO gives a clean launch at green.
    RedApproachHandback: false
    MinControlSpeed: 2.0
    SamplingTopK: 1        # 1 = greedy (deterministic)
    InferenceStride: 3     # infer every 3 steps, replay the token sub-steps
    NetFile: './simple_traffic_light.net.xml'
    # CATK checkpoint + tokens (absolute; live outside the repo)
    ModelDir: 'C:/src_git/WM_AlpaSim/data/trafficsim-models/catk_v120'
    TokenDir: 'C:/src_git/WM_AlpaSim/data/trafficsim-models/tokens'
    Device: cuda
    ip: ['127.0.0.1']
    port: [2444]
