# =============================================================================
# FIXS #174 -- SUMO <-> Carla co-simulation, EgoMode 2 "Advisory" (L2).
#
# L2 = L0 + an EXTERNAL desired-speed advisory. The ego is a REAL Carla vehicle
# (full PhysX dynamics), driven by an L0 driver (here the SDK-free EgoDriver
# pure-pursuit module) -- but its TARGET speed is no longer the static
# EgoTargetSpeed. Instead an artificial external controller (CommonLib/
# EgoSpeedAdvisor, the stand-in for a real CAV speed planner streaming over FIXS)
# supplies a time-varying desired speed each 0.1 s feed. The bridge routes it to
# the driver through the L2 actuation seam CarlaBackend::applyEgoControl.
#
# What to verify: the ego's MEASURED speed tracks the COMMANDED advisory with
# realistic powertrain/brake lag -- it visibly accelerates, cruises, and slows
# on the loop. The DataLogger records both `speed` (measured) and `speedDesired`
# (commanded advisory) so the tracking is directly plottable.
#
# EgoMode ladder (CarlaSetup.EgoMode):
#   0 = SumoDriver  : SUMO drives the ego, Carla teleports it (config.yaml)
#   1 = CarlaDriver : L0 -- Carla drives the ego (config_l0_egodriver.yaml / _tm)
#   2 = Advisory    : L2 -- + external desired-speed advisory via FIXS -- THIS FILE
#   3 = Control     : L4 -- + external throttle/brake/steer via FIXS     [reserved]
#
# Run: run_sumo_carla_l2_advisory.bat (one click). Background traffic is SUMO-
# driven; the ego is injected into SUMO from the Carla readback (as in L0/L1).
# =============================================================================

SimulationSetup:
    EnableRealSim: true
    EnableVerboseLog: false

    SelectedTrafficSimulator: 'SUMO'

    SimulationEndTime: 1000

    VehicleMessageField: [id, type, vehicleClass, speed, speedDesired, positionX, positionY, positionZ, heading, grade, length, width, height, color, linkId, laneId]

    TrafficSimulatorIP: '127.0.0.1'
    TrafficSimulatorPort: 1337

SumoSetup:
    SpeedMode: 32

# Carla connects to the FIXS Application publish endpoint (ip/port[0] below).
ApplicationSetup:
    EnableApplicationLayer: true
    VehicleSubscription:
    -   type: ego
        attribute: { id: ['ego'], radius: [500] }
        ip: ['127.0.0.1']
        port: [440]

XilSetup:
    EnableXil: false

CarlaSetup:
    EnableVerboseLog: true
    EnableCosimulation: true

    EnableExternalControl: true

    # ---- EgoMode 2: Carla drives the ego (L0) + external speed advisory (L2) ----
    EgoMode: 2
    # L0 driver actuating the ego. "Pursuit" (EgoDriver) makes the speed-tracking
    # unambiguous (direct proportional throttle/brake to the advisory). "TM" also
    # honors the advisory (via SetDesiredSpeed) but plans its own longitudinal gaps.
    EgoL0Driver: Pursuit
    EgoId: ego
    EgoSumoType: car
    EgoBlueprint: vehicle.tesla.model3
    EgoSpawnPose: [20.1, -3.0, 0.0, 90.0]   # [x, y, z, headingDeg] FIXS frame, on the flat loop
    TrafficManagerPort: 8000

    EgoRoutePoints: [[15.0, -3.0], [185.0, -3.0], [192.9, -1.9], [198.5, 1.5], [201.9, 7.1], [203.0, 15.0], [203.0, 185.0], [201.9, 192.9], [198.5, 198.5], [192.9, 201.9], [185.0, 203.0], [15.0, 203.0], [7.1, 201.9], [1.5, 198.5], [-1.9, 192.9], [-3.0, 185.0], [-3.0, 15.0], [-1.9, 7.1], [1.5, 1.5], [7.1, -1.9]]
    EgoRouteRepeat: 50
    EgoTargetSpeed: 8.33   # fallback target if no advisory profile is set (m/s)

    # ---- L2 artificial speed-advisory profile (EgoSpeedAdvisor) ----------------
    # [time_s, speed_mps] knots, piecewise-linear and LOOPED at the last knot time.
    # Trapezoid: accelerate 4->12 (0-8s), cruise 12 (8-16s), decelerate 12->4
    # (16-24s), cruise 4 (24-32s), then repeat. Last knot's speed == first knot's
    # for a smooth wrap. This is the "external controller" a real CAV planner
    # would replace with a live FIXS stream.
    EgoSpeedProfile: [[0.0, 4.0], [8.0, 12.0], [16.0, 12.0], [24.0, 4.0], [32.0, 4.0]]

    UseVehicleTypeAsBlueprint: false

    CarlaServerIP: 127.0.0.1
    CarlaServerPort: 2000

    CarlaClientIP: 127.0.0.1
    CarlaClientPort: 440

    TrafficRefreshRate: 0.1
    CarlaTimeStep: 0.05

    InterestedIds: ['ego']

    EnableSpectatorFollow: true
    CenteredViewId: ego
    SpectatorHeight: 50
    SpectatorAlignYaw: false

# Generic FIXS data logging (CommonLib/DataLogger). `speed` = MEASURED ego speed,
# `speedDesired` = COMMANDED advisory -- plot both to verify L2 speed tracking.
DataLogSetup:
    EnableDataLog: true
    DataLogPath: '_datalog/l2_advisory.csv'
    DataLogWho: ['ego']
    DataLogFields: [positionX, positionY, positionZ, heading, speed, speedDesired]
