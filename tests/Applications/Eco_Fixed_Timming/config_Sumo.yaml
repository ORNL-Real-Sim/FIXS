#pragma once
# Global Simulation setup
SimulationSetup:
    # Master Switch to turn on/off RealSim interface
    # if turned off, VISSIM will just run without RealSim
    # SUMO needs to run without traci
  EnableRealSim: true

    # Whether or not to save verbose log during the simulation. skip log can potentially speed up
  EnableVerboseLog: false

    # Simulation end time
    # if NOT specificed, SimulationEndTime will be set to a large value (90000 seconds)
    #--------------------------------------------------
  SimulationEndTime: 33000

    # specify which traffic simulator
    #--------------------------------------------------
  SelectedTrafficSimulator: "SUMO"

    # default will send all
  VehicleMessageField: [id, type, speed, acceleration, positionX, positionY, positionZ,
     linkId, laneId, distanceTravel, speedDesired, precedingVehicleId, precedingVehicleDistance, precedingVehicleSpeed,
     signalLightId, signalLightHeadId, signalLightDistance, signalLightColor, speedLimit, linkIdNext, routeEdges]
  # VehicleMessageField: [id, type, speed, acceleration, positionX, positionY, positionZ,
  #    linkId, laneId, distanceTravel, speedDesired]
  # VehicleMessageField: [id, type, vehicleClass, speed, acceleration, positionX, positionY, positionZ, heading,
  #   linkId, laneId, distanceTravel, speedDesired, grade]

    # by default it is false 
  EnableExternalDynamics: false   # set ture this so that simulink will control the response

  TrafficSimulatorIP: "127.0.0.1"
  TrafficSimulatorPort: 1337
SumoSetup:
    # set the speed mode, in integer. default value is 0
    # check Sumo documentation https://sumo.dlr.de/docs/TraCI/Change_Vehicle_State.html#speed_mode_0xb3

  SpeedMode: 31   # 31: default mode. 32: all checks off
  ExecutionOrder: 1  # execution order relative to other traffic simulators
  EgoID: "ego"
  EgoInsertTime: 29119.31


  EgoDepart: "now"         # depart
  EgoDepartLane: "0"       # departLane （first/best/random）
  EgoDepartPos: "1"        # departPos (free/random/m)
  EgoDepartSpeed: "0.1"    # departSpeed (m/s)

  VIDToRemove: "4.66"          #Vehicle ID to remove
  MaxAcceleration: 4.0         # ego maximu accelation
# ip and port are server ip and port

# setup Application Layer
ApplicationSetup:
    # turn on/off application layer
  EnableApplicationLayer: true

    #--------------------------------------------------
  VehicleSubscription:
    # Application from where to accept the vehicle data
    # 1. Receive data from FIXS LAYER
    # 2. Send data to XIL LAYER / Back to FIXS LAYER
  # - type: ego
  #   attribute: {id: ['ego'], radius: [0]}
  #   ip: ["127.0.0.1"]
  #   port: [430]

  - type: "ego"
    attribute: {all: ["true"], radius: [0]}
    ip: ["127.0.0.1"]
    port: [430]

  SignalSubscription:
  - type: "intersection"
    attribute: {all: ["true"]}
    ip: ["127.0.0.1"]
    port: [430]



    
XilSetup:
    # enable/disable XIL
  EnableXil: true
  VehicleSubscription:
  - type: "ego"
    attribute: {id: ["ego"], radius: [0]}
    ip: ["127.0.0.1"]
    port: [420]


